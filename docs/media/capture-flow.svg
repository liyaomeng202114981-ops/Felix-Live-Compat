<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="702" viewBox="0 0 1440 702" role="img" aria-label="Linux Portal、PipeWire、DMA-BUF、WGC 与官方客户端的采集流程"><title>Linux Portal、PipeWire、DMA-BUF、WGC 与官方客户端的采集流程</title><rect x="0" y="0" width="1440" height="702" rx="0" fill="#f3f1e9"/><text x="62" y="112" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="48" font-weight="800" fill="#161a1a" text-anchor="start" letter-spacing="0">画面在 Linux 采集，直播在官方客户端完成。</text><text x="64" y="176" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="28" font-weight="400" fill="#646962" text-anchor="start" letter-spacing="0">应用内选择素材 → Ubuntu 授权 → GPU 缓冲桥接 → 预览、合成与编码 → 推流</text><rect x="62" y="254" width="250" height="266" rx="24" fill="#ffffff" stroke="#d8dbd2" stroke-width="2"/><g transform="translate(156 287) scale(1)"><path d="M4 6 H60 V44 H4 Z M23 57 H41 M32 44 V57" fill="none" stroke="#13866d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="187" y="403" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="33" font-weight="700" fill="#161a1a" text-anchor="middle" letter-spacing="0">Ubuntu 画面</text><text x="187" y="461" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="18" font-weight="500" fill="#646962" text-anchor="middle" letter-spacing="0">桌面 / 任意可共享窗口</text><path d="M315 379 H325 M320 374 L325 379 L320 384" fill="none" stroke="#f62d53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="328" y="254" width="250" height="266" rx="24" fill="#ffffff" stroke="#d8dbd2" stroke-width="2"/><g transform="translate(422 287) scale(1)"><path d="M32 3 L56 13 V32 C56 48 32 61 32 61 C32 61 8 48 8 32 V13 Z M21 31 L29 39 L44 23" fill="none" stroke="#13866d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="453" y="403" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="33" font-weight="700" fill="#161a1a" text-anchor="middle" letter-spacing="0">系统授权</text><text x="453" y="461" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="18" font-weight="500" fill="#646962" text-anchor="middle" letter-spacing="0">Portal + PipeWire</text><path d="M581 379 H591 M586 374 L591 379 L586 384" fill="none" stroke="#f62d53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="594" y="254" width="250" height="266" rx="24" fill="#161a1a"/><g transform="translate(688 287) scale(1)"><path d="M12 12 H52 V52 H12 Z M22 22 H42 V42 H22 Z M21 3 V12 M42 3 V12 M21 52 V61 M42 52 V61 M3 21 H12 M3 42 H12 M52 21 H61 M52 42 H61" fill="none" stroke="#f62d53" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="719" y="403" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="33" font-weight="700" fill="#f3f1e9" text-anchor="middle" letter-spacing="0">兼容桥接</text><text x="719" y="461" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="18" font-weight="500" fill="#b4c2b8" text-anchor="middle" letter-spacing="0">DMA-BUF + WGC</text><path d="M847 379 H857 M852 374 L857 379 L852 384" fill="none" stroke="#f62d53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="860" y="254" width="250" height="266" rx="24" fill="#ffffff" stroke="#d8dbd2" stroke-width="2"/><g transform="translate(954 287) scale(1)"><path d="M8 15 H44 V49 H8 Z M44 26 L60 16 V48 L44 38 M25 25 L35 32 L25 39 Z" fill="none" stroke="#13866d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="985" y="403" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="33" font-weight="700" fill="#161a1a" text-anchor="middle" letter-spacing="0">直播伴侣</text><text x="985" y="461" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="18" font-weight="500" fill="#646962" text-anchor="middle" letter-spacing="0">官方客户端 + Felix-Proton</text><path d="M1113 379 H1123 M1118 374 L1123 379 L1118 384" fill="none" stroke="#f62d53" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1126" y="254" width="250" height="266" rx="24" fill="#ffffff" stroke="#d8dbd2" stroke-width="2"/><g transform="translate(1220 287) scale(1)"><path d="M5 32 H58 M45 18 L59 32 L45 46" fill="none" stroke="#13866d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1251" y="403" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="33" font-weight="700" fill="#161a1a" text-anchor="middle" letter-spacing="0">抖音直播间</text><text x="1251" y="461" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="18" font-weight="500" fill="#646962" text-anchor="middle" letter-spacing="0">伴侣推流端已短时实测</text><text x="64" y="596" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="28" font-weight="400" fill="#646962" text-anchor="start" letter-spacing="0">此处为直接采集链路；UnityCapture 作为独立回退保留。</text><text x="64" y="645" font-family="'Noto Sans CJK SC','Source Han Sans SC',sans-serif" font-size="25" font-weight="400" fill="#646962" text-anchor="start" letter-spacing="0">界面仍通过 Wine / Proton 兼容运行，原生 UI 体验持续改进中。</text></svg>